# Local development stack.
# Runs alongside the main docker-compose.yaml without clashing: separate project
# name, container names, volume and host ports (Postgres is published on 5434).
#
#   docker compose -f docker-compose.dev.yml up --build
name: dopshy-dev

services:
  db:
    image: postgres:latest
    container_name: db_dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/
    volumes:
      - postgresql_db_data_dev:/var/lib/postgresql/data/
    expose:
      - 5432
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_editor:
    image: adminer
    container_name: db_editor_dev
    restart: unless-stopped
    expose:
      - 8080
    ports:
      - "8082:8080"
    depends_on:
      - db

  backend_app:
    container_name: backend_app_dev
    restart: unless-stopped
    build:
      dockerfile: Dockerfile
      context: ./backend/
    env_file:
      - .env
    environment:
      # Inside the compose network the app talks to Postgres on its internal port.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./backend/:/usr/backend/
    expose:
      - 8000
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgresql_db_data_dev:
